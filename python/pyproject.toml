[project]
name = "uriel"
version = "0.2.0"
description = "Python bindings for Uriel, through its C ABI"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Aditya Chanana", email = "achanana@cs.cmu.edu" }]
maintainers = [{ name = "CMU Satyalab", email = "gabriel@cmusatyalab.org" }]
# The Python versions that are still supported upstream.
requires-python = ">=3.11"
dependencies = ["cffi>=1.17"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
]

[project.urls]
Repository = "https://github.com/cmusatyalab/uriel"

[dependency-groups]
dev = ["pytest>=8", "numpy>=2"]

[build-system]
# maturin runs cffi to write the declarations of uriel._native.
requires = ["maturin>=1.9,<2", "cffi>=1.17"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "../rust/Cargo.toml"
bindings = "cffi"
python-source = "src"
module-name = "uriel._native"

[tool.uv]
# uv rebuilds the package when these change, not only when Python files do.
cache-keys = [{ file = "pyproject.toml" }, { file = "../rust/Cargo.toml" }, { file = "../rust/src/**/*.rs" }]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
