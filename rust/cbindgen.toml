language = "C"
header = """
/*
 * Uriel's C API.
 *
 * Every function returns a uriel_status_t. After a failure, uriel_last_error() says what went
 * wrong. Objects are opaque handles: uriel_*_create makes one, uriel_*_destroy frees it, and a
 * function that acts on a handle takes it first. Strings are NUL-terminated UTF-8.
 *
 * Names: producers, clients, servers and engines each have a name, and find each other on one
 * machine by name alone, through shared memory. A name is 1 to 64 bytes, without '/', and must be
 * unique on the machine among the objects of its kind; a producer and an engine may share one. A
 * flow's name only needs to be unique within its client.
 *
 * A producer, an engine, a subscription and a reader must stay on the thread that created them.
 * A client and a server may be used from any thread.
 *
 * A program must not use a library whose uriel_abi_version() differs from this header's
 * URIEL_ABI_VERSION. Enums are 32 bits wide, and new values may be added at the end, so handle
 * values you don't know.
 */"""
include_guard = "URIEL_H"
autogen_warning = "/* Generated by cbindgen from rust/src/ffi.rs. Do not edit by hand. */"
no_includes = true
sys_includes = ["stddef.h", "stdint.h"]
cpp_compat = true
style = "type"
usize_is_size_t = true

[export]
include = ["Status"]
# Internal limits that callers never need.
exclude = ["MAX_CHILDREN"]

[export.rename]
"Status" = "uriel_status_t"
"Producer" = "uriel_producer_t"
"Client" = "uriel_client_t"
"Server" = "uriel_server_t"
"Engine" = "uriel_engine_t"
"InputIdView" = "uriel_input_id_t"
"InputView" = "uriel_input_t"
"Subscription" = "uriel_subscription_t"
"EventView" = "uriel_event_t"
"Reader" = "uriel_reader_t"
"ReadInputView" = "uriel_read_input_t"
"EventKindView" = "uriel_event_kind_t"
"OutcomeView" = "uriel_outcome_t"
"ClientOptions" = "uriel_client_options_t"
"ServerOptions" = "uriel_server_options_t"
"ABI_VERSION" = "URIEL_ABI_VERSION"
"MAX_FLOW_NAME" = "URIEL_MAX_FLOW_NAME"
"MAX_PAYLOAD_TYPE_NAME" = "URIEL_MAX_PAYLOAD_TYPE_NAME"
"MAX_ENGINE_NAME" = "URIEL_MAX_ENGINE_NAME"
"MAX_PRODUCER_NAME" = "URIEL_MAX_PRODUCER_NAME"

[enum]
rename_variants = "QualifiedScreamingSnakeCase"
prefix_with_name = false
