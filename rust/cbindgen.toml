language = "C"
include_guard = "URIEL_H"
autogen_warning = "/* Generated by cbindgen from rust/src/ffi.rs. Do not edit by hand. */"
cpp_compat = true
style = "type"
usize_is_size_t = true

[export]
include = ["Status"]
# Internal limits that callers never need.
exclude = ["MAX_CHILDREN"]

[export.rename]
"Status" = "uriel_status_t"
"Producer" = "uriel_producer_t"
"Client" = "uriel_client_t"
"Server" = "uriel_server_t"
"Engine" = "uriel_engine_t"
"InputIdView" = "uriel_input_id_t"
"InputView" = "uriel_input_t"
"Subscription" = "uriel_subscription_t"
"EventView" = "uriel_event_t"
"Reader" = "uriel_reader_t"
"ReadInputView" = "uriel_read_input_t"
"EventKindView" = "uriel_event_kind_t"
"OutcomeView" = "uriel_outcome_t"
"ClientOptions" = "uriel_client_options_t"
"ServerOptions" = "uriel_server_options_t"
"ABI_VERSION" = "URIEL_ABI_VERSION"
"MAX_FLOW_NAME" = "URIEL_MAX_FLOW_NAME"
"MAX_PAYLOAD_TYPE_NAME" = "URIEL_MAX_PAYLOAD_TYPE_NAME"
"MAX_ENGINE_NAME" = "URIEL_MAX_ENGINE_NAME"
"MAX_PRODUCER_NAME" = "URIEL_MAX_PRODUCER_NAME"

[enum]
rename_variants = "QualifiedScreamingSnakeCase"
prefix_with_name = false
