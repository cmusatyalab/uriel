[package]
name = "uriel-bench"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Runs a Uriel flow with synthetic engines and records when each input reached each stage"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
uriel = { path = "../rust" }
humantime = "2.4.0"
humantime-serde = "1.1.1"
rand = "0.10.3"
rand_distr = "0.6.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
