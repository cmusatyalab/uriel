name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install libclang
        # libclang generates iceoryx2's bindings.
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-c

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod

      - uses: astral-sh/setup-uv@v5

      - name: Check that the license copies match
        # The Go module and the Python package each ship their own copy.
        run: cmp LICENSE go/LICENSE && cmp LICENSE python/LICENSE

      - name: Rust
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          # Services in the process's memory instead of shared memory, as on Android.
          cargo clippy -p uriel --all-targets --features in-process --locked -- -D warnings
          cargo test -p uriel --features in-process --locked
          # The Android client is its own workspace, because it turns on `in-process`.
          (cd android/uniffi && cargo fmt --check && cargo clippy --all-targets --locked -- -D warnings && cargo test --locked)

      - name: Check that the C header is up to date
        # The build regenerates it from rust/src/ffi.rs.
        run: git diff --exit-code rust/include

      - name: Install liburiel
        run: |
          cargo cinstall --release --locked -p uriel --library-type staticlib --prefix "$HOME/.local" --libdir lib
          echo "PKG_CONFIG_PATH=$HOME/.local/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Go
        run: |
          test -z "$(gofmt -l go examples/go)"
          (cd go && go vet ./... && go test ./...)
          go vet ./examples/go/...

      - name: C example
        run: make -C examples/c/hello CFLAGS="-std=c11 -O2 -Wall -Wextra -Werror"

      - name: Python
        working-directory: python
        run: |
          uvx ruff check .
          uvx ruff format --check .
          # The oldest and the newest Python that the package supports.
          uv run --locked --python 3.11 pytest
          uv run --locked --python 3.14 pytest
